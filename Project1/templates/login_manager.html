{% extends "base.html" %}
{% block title %}Manager Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5 auth-hero">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card portal-card manager shadow">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="display-4 text-success"><i class="fa-solid fa-user-tie"></i></div>
          <h3 class="fw-bold mt-2">Manager Login</h3>
          <p class="text-muted small">Approve claims &amp; manage your team</p>
        </div>
        <form method="post" action="{{ url_for('auth.login') }}?portal=manager" novalidate>
          <input type="hidden" name="portal" value="manager">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text text-success"><i class="fa-solid fa-user-tie"></i></span>
              <input type="text" class="form-control" name="username" placeholder="Manager username" required autofocus autocomplete="username">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" class="form-control" name="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
          </div>
          <div class="d-grid">
            <button class="btn btn-success btn-lg" type="submit"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In as Manager</button>
          </div>
        </form>
        <div class="alert alert-success mt-3 py-2 small mb-0">
          <i class="fa-solid fa-shield-halved me-1"></i> Managers can add &amp; remove employee accounts.
        </div>
        <hr class="my-3">
        <div class="text-center small text-muted">
          Login as:&nbsp;
          <a href="{{ url_for('auth.login', portal='user') }}" class="text-primary fw-semibold">Employee</a> &middot;
          <a href="{{ url_for('auth.login', portal='finance') }}" style="color:#6f42c1" class="fw-semibold">Finance</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
