{% extends "base.html" %}
{% block title %}Employee Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5 auth-hero">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card portal-card employee shadow">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="display-4 text-primary"><i class="fa-solid fa-user-circle"></i></div>
          <h3 class="fw-bold mt-2">Employee Login</h3>
          <p class="text-muted small">Access your expense dashboard</p>
        </div>
        <form method="post" action="{{ url_for('auth.login') }}?portal=user" novalidate>
          <input type="hidden" name="portal" value="user">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
              <input type="text" class="form-control" name="username" placeholder="Enter username or email" required autofocus autocomplete="username">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" class="form-control" name="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary btn-lg" type="submit"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In</button>
          </div>
        </form>
        <hr class="my-3">
        <div class="text-center small text-muted">
          Login as:&nbsp;
          <a href="{{ url_for('auth.login', portal='manager') }}" class="text-success fw-semibold">Manager</a> &middot;
          <a href="{{ url_for('auth.login', portal='finance') }}" class="text-purple fw-semibold" style="color:#6f42c1">Finance</a> &middot;
          <a href="{{ url_for('auth.login', portal='admin') }}" class="text-danger fw-semibold">Admin</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
