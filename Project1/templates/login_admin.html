{% extends "base.html" %}
{% block title %}System Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5 auth-hero">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card portal-card admin shadow">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="display-4" style="color:#dc3545"><i class="fa-solid fa-user-shield"></i></div>
          <h3 class="fw-bold mt-2">Admin Login</h3>
          <p class="text-muted small">System configuration &amp; user management</p>
        </div>
        <form method="post" action="{{ url_for('auth.login') }}?portal=admin" novalidate>
          <input type="hidden" name="portal" value="admin">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text" style="color:#dc3545"><i class="fa-solid fa-user-shield"></i></span>
              <input type="text" class="form-control" name="username" placeholder="Admin username" required autofocus autocomplete="username">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" class="form-control" name="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
          </div>
          <div class="d-grid">
            <button class="btn btn-lg text-white" style="background:#dc3545" type="submit"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In as Admin</button>
          </div>
        </form>
        <hr class="my-3">
        <div class="text-center small text-muted">
          Login as:&nbsp;
          <a href="{{ url_for('auth.login', portal='user') }}" class="text-primary fw-semibold">Employee</a> &middot;
          <a href="{{ url_for('auth.login', portal='manager') }}" class="text-success fw-semibold">Manager</a> &middot;
          <a href="{{ url_for('auth.login', portal='finance') }}" class="text-purple fw-semibold" style="color:#6f42c1">Finance</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
