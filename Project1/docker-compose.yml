services:
  flask:
    build: .
    container_name: flask-app
    ports:
       - "5000:5000"
    environment:
       DB_HOST: "mysql"
       DB_PORT: "3306"
       DB_NAME: "travel_2"
       DB_USER: "root"
       DB_PASSWORD: "mysql@rajiv"
    depends_on:
        - mysql
    networks:
      - app-network

  mysql:
       image: mysql:8.4
       container_name: mysql_db 
       environment:
         MYSQL_ROOT_PASSWORD: "mysql@rajiv"
         MYSQL_DATABASE: "travel_2"
       ports:
         -  "3307:3306"
       volumes:
          - mysql-data:/var/lib/mysql
       networks:
         - app-network


volumes:
  mysql-data:

networks:
   app-network: